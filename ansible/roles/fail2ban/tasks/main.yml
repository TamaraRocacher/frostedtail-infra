---
- name: Install fail2ban
  ansible.builtin.apt:
    name: fail2ban
    state: present

- name: Deploy fail2ban template
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Test fail2ban config
  ansible.builtin.command:
    cmd: fail2ban-client -t
  changed_when: false
  check_mode: false

- name: Start and activate fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
