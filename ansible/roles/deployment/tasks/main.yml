---
- name: Create deployment root directory
  ansible.builtin.file:
    path: "{{ deployment_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create deployment environment directories
  ansible.builtin.file:
    path: "{{ deployment_root }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ deployment_environments }}"

- name: Deploy staging compose
  ansible.builtin.template:
    src: compose.staging.yml.j2
    dest: "{{ deployment_root }}/staging/compose.yml"
    owner: root
    group: root
    mode: "0644"
